<mat-card class="post-body">
    <mat-card-header class="post-header">
        <div class="title-row">
            <mat-card-title #tooltip="matTooltip" [matTooltip]="postObj.title">
                <span class="post-title">{{postObj.title}}</span>
                <span class="post-status">
                    <span class="status-dot" [ngClass]="{
                        'active':postObj.status==='active',
                        'draft':postObj.status==='draft'
                    }"></span>

                    <span class="status-text">
                        {{postObj.status|titlecase}}
                    </span>
                </span>
            </mat-card-title>
        </div>
    </mat-card-header>
    <mat-card-content class="post-content mt-2">
        <p>
            {{postObj.body}}
        </p>
    </mat-card-content>
    <mat-divider class="mt-2"></mat-divider>
    <mat-card-actions class="post-actions d-flex justify-content-between">
        <button (click)="onEdit()" class="edit-btn" mat-button><mat-icon>edit</mat-icon></button>
        <button [disabled]="editObjId===postObj.id" (click)="onRemove()" class="delete-btn"
            mat-button><mat-icon>delete</mat-icon></button>
    </mat-card-actions>
</mat-card>
